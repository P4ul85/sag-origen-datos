name: Vigilante de registros SAG
on:
  schedule:
    - cron: '17 11,23 * * *'   # ~08:17 y 20:17 Chile
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: registros
  cancel-in-progress: false
jobs:
  registros:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests beautifulsoup4
      - name: Rastrear registros del SAG y actualizar registros_sag.json
        run: python3 scripts/registros_fetch.py
      - name: Regenerar docs_fix.json (enlaces de documentos de la app -> URL oficial del SAG)
        run: python3 scripts/docs_fix_build.py --write || true
      - name: Commit si cambió
        run: |
          if git status --porcelain registros_sag.json docs_fix.json | grep -q .; then
            git config user.name 'SAG registros bot'
            git config user.email 'noreply@anthropic.com'
            N=$(python3 -c "import json;print(json.load(open('registros_sag.json'))['n'])")
            D=$(python3 -c "import json;print(json.load(open('docs_fix.json'))['n'])" 2>/dev/null || echo 0)
            git add registros_sag.json docs_fix.json
            git commit -m "Registros SAG automático: $N documentos, $D enlaces corregidos ($(date +%d-%m-%Y))"
            git push
            echo "actualizado: $N documentos, $D enlaces"
          else
            echo "sin cambios"
          fi
      - name: Avisar si falló
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "⚠️ Falló el vigilante de registros SAG" \
            --body "Workflow $GITHUB_WORKFLOW falló el $(date -u). Log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
